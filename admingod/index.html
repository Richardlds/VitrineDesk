<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VitrineDesk God - Super Admin</title>

    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest" defer></script>

    <!-- Design System (Mobile First) -->
    <!-- Reutilizando CSS do novo admin para consistência visual -->
    <link rel="stylesheet" href="/admin/css/design-system.css">
    <link rel="stylesheet" href="/admin/css/tickets.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>

    <!-- Script Principal (Módulos ES6) -->
    <script type="module" src="/admingod/js/core/app.js"></script>
</head>

<body>
    <div class="admin-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-container" style="display: flex; align-items: center; gap: 8px;">
                    <i data-lucide="zap" class="brand-icon text-danger"></i>
                    <span class="brand-text">VitrineDesk God</span>
                </div>
                <button class="menu-toggle d-md-none" aria-label="Fechar Menu">
                    <i data-lucide="x"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <!-- PRINCIPAL -->
                <div class="nav-section">Global</div>
                <button class="nav-item active" data-tab="dashboard">
                    <i data-lucide="layout-dashboard"></i> Visão Geral
                </button>

                <!-- CADASTROS E GESTÃO -->
                <div class="nav-section">Controle Master</div>
                <button class="nav-item" data-tab="tenants">
                    <i data-lucide="store"></i> Tenants (Lojas)
                </button>
                <button class="nav-item" data-tab="planos">
                    <i data-lucide="credit-card"></i> Planos & Assinaturas
                </button>
                <button class="nav-item" data-tab="clientes">
                    <i data-lucide="users"></i> Clientes Globais
                </button>
                <button class="nav-item" data-tab="mensagens">
                    <i data-lucide="mail"></i> Mensagens do Site
                </button>

                <div class="nav-section">Sistema</div>
                <button class="nav-item" data-tab="notificacoes">
                    <i data-lucide="bell-ring"></i> Central de Notificações
                </button>
                <button class="nav-item" data-tab="tickets">
                    <i data-lucide="life-buoy"></i> Tickets de Suporte
                </button>
                <button class="nav-item" data-tab="relatorios">
                    <i data-lucide="bar-chart-2"></i> Relatórios
                </button>
                <button class="nav-item" data-tab="configuracoes">
                    <i data-lucide="settings"></i> Configurações Master
                </button>
            </nav>
            <div class="sidebar-footer">
                <button class="btn-logout" id="btn-logout" style="color: var(--danger);">
                    <i data-lucide="log-out"></i> Sair
                </button>
            </div>
        </aside>

        <!-- Main Wrapper -->
        <div class="main-wrapper">
            <!-- Topbar -->
            <header class="topbar topbar-glass flex justify-between align-center px-4 py-3 border-bottom-dashed border-border w-100 gap-4">
                <!-- Esquerda: Toggle + Busca -->
                <div class="flex align-center gap-3 flex-1">
                    <button class="menu-toggle d-md-none bg-transparent border-none text-primary cursor-pointer p-1" aria-label="Abrir Menu">
                        <i data-lucide="menu"></i>
                    </button>
                    
                    <div class="flex align-center gap-2 d-none d-md-flex">
                        <h2 class="text-primary m-0" id="page-title">God Mode</h2>
                        <span class="badge bg-danger-light text-danger px-2 py-1 rounded-full text-xs font-bold border border-danger">Super Admin</span>
                    </div>
                </div>

                <!-- Centro: Barra de Pesquisa Spotlight -->
                <div class="topbar-search d-none d-lg-flex flex-1" style="max-width: 600px;" onclick="if(window.showToast) window.showToast('Busca global ativada!', 'info')">
                    <i data-lucide="search" class="icon-sm text-secondary"></i>
                    <span class="flex-1 text-left text-secondary">Buscar loja, cliente ou plano...</span>
                    <span class="topbar-search-kbd">Ctrl+K</span>
                </div>

                <!-- Direita: Ações Rápidas + Sino + Perfil -->
                <div class="flex align-center gap-3">
                    <!-- Quick Actions -->
                    <div class="flex align-center gap-2 d-none d-sm-flex border-right-dashed border-border pr-3 mr-1">
                        <button class="btn bg-primary text-white text-xs py-1 px-3 rounded-full flex align-center gap-1 shadow-sm hover-float cursor-pointer border-none" onclick="document.querySelector('[data-tab=\'tenants\']')?.click(); setTimeout(() => document.getElementById('btn-novo-tenant')?.click(), 500);" title="Novo Lojista">
                            <i data-lucide="plus" class="icon-xs"></i> Lojista
                        </button>
                    </div>

                    <button id="btn-toggle-theme" class="bg-transparent border-none text-secondary cursor-pointer hover:text-primary transition-colors p-1 rounded hover:bg-hover" title="Alternar Tema" onclick="window.toggleTheme(this)">
                        <i data-lucide="moon" class="icon-sm" id="theme-icon"></i>
                    </button>

                    <!-- Sino de Notificações -->
                    <div class="notification-container">
                        <button id="btn-notifications"
                            class="bg-transparent border-none text-secondary cursor-pointer hover:text-primary transition-colors relative p-1"
                            title="Notificações da Rede">
                            <i data-lucide="bell"></i>
                            <span id="notifications-badge" class="badge-dot d-none"></span>
                        </button>

                        <div id="notifications-drawer" class="notification-drawer d-none">
                            <div class="p-3 border-bottom-dashed border-border flex justify-between align-center bg-card-hover rounded-t-lg">
                                <span class="font-bold text-sm text-primary">Avisos da Rede</span>
                                <button id="btn-mark-all-read" class="text-xs text-primary-light hover:text-primary transition-colors cursor-pointer bg-transparent border-none">Lidas</button>
                            </div>
                            <div id="notifications-list" class="flex-1 overflow-y-auto custom-scrollbar p-2 flex flex-col gap-2" style="max-height: 300px;">
                                <div class="text-center p-4 text-xs text-secondary">A rede está operando normalmente.</div>
                            </div>
                            <div class="p-2 border-top-dashed border-border bg-card-hover text-center rounded-b-lg">
                                <a href="#" onclick="document.querySelector('[data-tab=\'notificacoes\']').click(); return false;" class="text-xs text-secondary hover:text-primary transition-colors text-decoration-none">Ver todas na Central</a>
                            </div>
                        </div>
                    </div>

                    <div class="user-dropdown-container position-relative">
                        <div class="user-profile flex align-center gap-2 cursor-pointer p-1 rounded-md" style="transition: var(--transition);">
                            <div class="avatar w-40px h-40px rounded-full bg-danger-light flex align-center justify-center text-danger font-bold border border-danger">
                                GOD
                            </div>
                            <div class="user-info d-none d-md-flex flex-column">
                                <span class="user-name text-sm font-bold text-primary">Master Admin</span>
                                <span class="user-role text-xs text-secondary">Acesso Total</span>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Main Content Area for Router -->
            <main class="content-area p-4" id="app-content">
                <!-- Conteúdo injetado pelo Router -->
            </main>
        </div>
    </div>
</body>
</html>
