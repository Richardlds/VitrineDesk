<div class="admin-section fade-in">
    <!-- Header -->
    <div class="mb-4">
        <h2 class="mb-1 text-primary">Personalização (GOD Mode)</h2>
        <p class="text-secondary text-sm">Configure as cores e a aparência do seu próprio painel administrativo mestre.</p>
    </div>

    <div class="config-card mb-4 p-4 tab-content">
        <h3 class="text-primary mb-3 mt-0 flex align-center gap-2 border-bottom-dashed pb-2"> <i data-lucide="monitor" class="icon-sm"></i> Tema e Cores</h3>
        <div class="mt-2">
            <p class="text-xs text-secondary mb-3">Escolha um dos nossos templates premium ou defina suas próprias cores.</p>

            <div class="mb-4 pt-3 border-top-dashed border-placeholder">
                <label class="font-medium text-sm text-secondary mb-3 inline-block">Templates Corporativos</label>
                <div class="grid-cols-2 grid-md-4 gap-3">
                    
                    <button type="button"
                        class="btn bg-placeholder hover:bg-hover border-dashed text-primary text-xs py-3 px-2 rounded-md cursor-pointer transition-colors template-admin-btn flex flex-column align-center justify-center gap-2 h-100 w-100"
                        data-template="god-red">
                        <div class="flex" style="pointer-events: none;">
                            <span class="w-24px h-24px rounded-full"
                                style="background: #ef4444; border: 2px solid var(--color-bg-surface);"></span>
                            <span class="w-24px h-24px rounded-full"
                                style="background: #050505; border: 2px solid var(--color-bg-surface); margin-left: -8px;"></span>
                        </div>
                        <span style="pointer-events: none;" class="font-bold">God Mode (Red)</span>
                    </button>

                    <button type="button"
                        class="btn bg-placeholder hover:bg-hover border-dashed text-primary text-xs py-3 px-2 rounded-md cursor-pointer transition-colors template-admin-btn flex flex-column align-center justify-center gap-2 h-100 w-100"
                        data-template="dark-premium">
                        <div class="flex" style="pointer-events: none;">
                            <span class="w-24px h-24px rounded-full"
                                style="background: #3B82F6; border: 2px solid var(--color-bg-surface);"></span>
                            <span class="w-24px h-24px rounded-full"
                                style="background: #05050A; border: 2px solid var(--color-bg-surface); margin-left: -8px;"></span>
                        </div>
                        <span style="pointer-events: none;" class="font-bold">Dark Premium</span>
                    </button>

                    <button type="button"
                        class="btn bg-placeholder hover:bg-hover border-dashed text-primary text-xs py-3 px-2 rounded-md cursor-pointer transition-colors template-admin-btn flex flex-column align-center justify-center gap-2 h-100 w-100"
                        data-template="neon-cyber">
                        <div class="flex" style="pointer-events: none;">
                            <span class="w-24px h-24px rounded-full"
                                style="background: #ff00ff; border: 2px solid var(--color-bg-surface);"></span>
                            <span class="w-24px h-24px rounded-full"
                                style="background: #080010; border: 2px solid var(--color-bg-surface); margin-left: -8px;"></span>
                        </div>
                        <span style="pointer-events: none;" class="font-bold">Neon Cyberpunk</span>
                    </button>

                    <button type="button"
                        class="btn bg-placeholder hover:bg-hover border-dashed text-primary text-xs py-3 px-2 rounded-md cursor-pointer transition-colors template-admin-btn flex flex-column align-center justify-center gap-2 h-100 w-100"
                        data-template="hacker-green">
                        <div class="flex" style="pointer-events: none;">
                            <span class="w-24px h-24px rounded-full"
                                style="background: #10b981; border: 2px solid var(--color-bg-surface);"></span>
                            <span class="w-24px h-24px rounded-full"
                                style="background: #020617; border: 2px solid var(--color-bg-surface); margin-left: -8px;"></span>
                        </div>
                        <span style="pointer-events: none;" class="font-bold">Matrix Green</span>
                    </button>

                    <button type="button"
                        class="btn bg-placeholder hover:bg-hover border-dashed text-primary text-xs py-3 px-2 rounded-md cursor-pointer transition-colors template-admin-btn flex flex-column align-center justify-center gap-2 h-100 w-100"
                        data-template="corp-indigo">
                        <div class="flex" style="pointer-events: none;">
                            <span class="w-24px h-24px rounded-full"
                                style="background: #635BFF; border: 2px solid var(--color-bg-surface);"></span>
                            <span class="w-24px h-24px rounded-full"
                                style="background: #0A2540; border: 2px solid var(--color-bg-surface); margin-left: -8px;"></span>
                        </div>
                        <span style="pointer-events: none;" class="font-bold">Fintech Indigo</span>
                    </button>

                    <button type="button"
                        class="btn bg-placeholder hover:bg-hover border-dashed text-primary text-xs py-3 px-2 rounded-md cursor-pointer transition-colors template-admin-btn flex flex-column align-center justify-center gap-2 h-100 w-100"
                        data-template="barber-gold">
                        <div class="flex" style="pointer-events: none;">
                            <span class="w-24px h-24px rounded-full"
                                style="background: #d4af37; border: 2px solid var(--color-bg-surface);"></span>
                            <span class="w-24px h-24px rounded-full"
                                style="background: #111111; border: 2px solid var(--color-bg-surface); margin-left: -8px;"></span>
                        </div>
                        <span style="pointer-events: none;" class="font-bold">Gold Luxury</span>
                    </button>
                    
                    <button type="button"
                        class="btn bg-placeholder hover:bg-hover border-dashed text-primary text-xs py-3 px-2 rounded-md cursor-pointer transition-colors template-admin-btn flex flex-column align-center justify-center gap-2 h-100 w-100"
                        data-template="light-minimal">
                        <div class="flex" style="pointer-events: none;">
                            <span class="w-24px h-24px rounded-full"
                                style="background: #000000; border: 2px solid var(--color-bg-surface);"></span>
                            <span class="w-24px h-24px rounded-full"
                                style="background: #FFFFFF; border: 2px solid var(--color-bg-surface); margin-left: -8px;"></span>
                        </div>
                        <span style="pointer-events: none;" class="font-bold">Light Minimal</span>
                    </button>

                     <button type="button"
                        class="btn bg-placeholder hover:bg-hover border-dashed text-primary text-xs py-3 px-2 rounded-md cursor-pointer transition-colors template-admin-btn flex flex-column align-center justify-center gap-2 h-100 w-100"
                        data-template="corp-blue">
                        <div class="flex" style="pointer-events: none;">
                            <span class="w-24px h-24px rounded-full"
                                style="background: #0070d2; border: 2px solid var(--color-bg-surface);"></span>
                            <span class="w-24px h-24px rounded-full"
                                style="background: #F4F6F9; border: 2px solid var(--color-bg-surface); margin-left: -8px;"></span>
                        </div>
                        <span style="pointer-events: none;" class="font-bold">Corporate Blue</span>
                    </button>
                </div>
            </div>

            <div class="grid-cols-2 grid-md-3 gap-4 mb-3 pt-3 border-top-dashed border-placeholder">
                <div>
                    <label class="font-medium text-sm text-secondary mb-1 inline-block">Cor Primária (Destaque)</label>
                    <div class="flex align-center gap-2">
                        <input type="color" value="#ef4444"
                            class="color-picker cursor-pointer border-none bg-transparent"
                            id="admin-color-primary-input">
                        <span class="text-sm color-hex-display">#ef4444</span>
                    </div>
                </div>
                <div>
                    <label class="font-medium text-sm text-secondary mb-1 inline-block">Cor Secundária</label>
                    <div class="flex align-center gap-2">
                        <input type="color" value="#fca5a5"
                            class="color-picker cursor-pointer border-none bg-transparent"
                            id="admin-color-secondary-input">
                        <span class="text-sm color-hex-display">#fca5a5</span>
                    </div>
                </div>
            </div>

            <div class="grid-cols-2 grid-md-3 gap-4 mb-3 pt-3 border-top-dashed border-placeholder">
                <div>
                    <label class="font-medium text-sm text-secondary mb-1 inline-block">Fundo Principal (Base)</label>
                    <div class="flex align-center gap-2">
                        <input type="color" value="#050505"
                            class="color-picker cursor-pointer border-none bg-transparent"
                            id="admin-color-bg-base-input">
                        <span class="text-sm color-hex-display">#050505</span>
                    </div>
                </div>
                <div>
                    <label class="font-medium text-sm text-secondary mb-1 inline-block">Fundo de Cards/Menu</label>
                    <div class="flex align-center gap-2">
                        <input type="color" value="#111111"
                            class="color-picker cursor-pointer border-none bg-transparent"
                            id="admin-color-bg-surface-input">
                        <span class="text-sm color-hex-display">#111111</span>
                    </div>
                </div>
            </div>

            <div class="grid-cols-2 grid-md-3 gap-4 mb-3 pt-3 border-top-dashed border-placeholder">
                <div>
                    <label class="font-medium text-sm text-secondary mb-1 inline-block">Texto Principal</label>
                    <div class="flex align-center gap-2">
                        <input type="color" value="#f8fafc"
                            class="color-picker cursor-pointer border-none bg-transparent"
                            id="admin-color-text-primary-input">
                        <span class="text-sm color-hex-display">#f8fafc</span>
                    </div>
                </div>
                <div>
                    <label class="font-medium text-sm text-secondary mb-1 inline-block">Texto Secundário (Tons médios)</label>
                    <div class="flex align-center gap-2">
                        <input type="color" value="#94a3b8"
                            class="color-picker cursor-pointer border-none bg-transparent"
                            id="admin-color-text-secondary-input">
                        <span class="text-sm color-hex-display">#94a3b8</span>
                    </div>
                </div>
            </div>

            <div class="mt-4 border-top-dashed border-placeholder pt-4 flex gap-3">
                <button type="button" id="btn-save-god-theme" class="btn btn-primary px-6 py-2 rounded-lg font-bold flex align-center gap-2 cursor-pointer shadow-premium hover:brightness-110">
                    <i data-lucide="save" class="icon-sm"></i> Salvar e Aplicar
                </button>
                <button type="button" id="btn-reset-god-theme" class="btn bg-transparent text-secondary border border-dashed px-6 py-2 rounded-lg font-bold flex align-center gap-2 cursor-pointer hover:bg-placeholder">
                    <i data-lucide="rotate-ccw" class="icon-sm"></i> Restaurar Padrão
                </button>
            </div>
        </div>
    </div>
</div>
