<div class="agenda-shell">
  <section class="page-head">
    <div>
      <h1 class="text-primary">Agenda Diária</h1>
      <p class="muted" id="daySummary">Carregando agendamentos…</p>
    </div>
    <div class="date-nav">
      <button class="agenda-btn" data-day="-1" type="button">Ontem</button>
      <button class="agenda-btn" data-day="0" type="button">Hoje</button>
      <button class="agenda-btn" data-day="1" type="button">Amanhã</button>
      <input type="date" id="datePicker" class="date-input" aria-label="Selecionar data" />
    </div>
  </section>

  <section class="pros" aria-label="Filtrar por profissional">
    <div class="pros-track" id="prosTrack"></div>
  </section>

  <nav class="agenda-tabs" role="tablist">
    <button class="agenda-tab is-active" role="tab" data-view="timeline" type="button">Timeline</button>
    <button class="agenda-tab" role="tab" data-view="table" type="button">Lista completa</button>
  </nav>

  <section class="kpis" id="kpis"></section>

  <!-- ÁREA A -->
  <section class="agenda-panel" id="view-timeline">
    <div class="timeline" id="timeline">
      <div class="tl-hours" id="tlHours"></div>
      <div class="tl-canvas" id="tlCanvas">
        <div class="tl-lines" id="tlLines"></div>
        <div class="tl-now" id="tlNow" hidden></div>
        <div class="tl-events" id="tlEvents"></div>
      </div>
    </div>
    <p class="agenda-empty" id="tlEmpty" hidden>Nenhum agendamento para este filtro.</p>
  </section>

  <!-- ÁREA B -->
  <section class="agenda-panel" id="view-table" hidden>
    <div class="agenda-table-wrap">
      <table class="agenda-grid">
        <thead>
          <tr>
            <th>Data / Hora</th><th>Cliente</th><th>Profissional</th>
            <th>Serviço</th><th class="ta-r">Preço</th><th>Status</th><th class="ta-r">Ações</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </section>
</div>

<div class="agenda-modal" id="modal" hidden>
  <div class="agenda-modal-backdrop" data-close></div>
  <div class="agenda-modal-card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="agenda-modal-x" data-close type="button" aria-label="Fechar">&times;</button>
    <h2 class="text-primary font-bold mb-0" id="mTitle">Detalhes</h2>
    <div id="mBody"></div>
  </div>
</div>
