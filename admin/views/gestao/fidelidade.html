<div class="admin-section">
    <!-- Header -->
    <div class="flex flex-wrap justify-between align-center gap-3 mb-4">
        <div>
            <h2 class="mb-1 text-primary">Programa de Fidelidade</h2>
            <p class="text-secondary text-sm">Configure regras e premie seus clientes mais assíduos.</p>
        </div>
        <button id="btn-configurar-fidelidade" class="btn btn-primary shadow-sm hover-float flex align-center gap-2 cursor-pointer">
            <i data-lucide="settings-2"></i> Configurar Programa
        </button>
    </div>

    <!-- Regra Vigente Banner (Injetado via JS) -->
    <div id="fidelidade-banner-container" class="mb-5">
        <!-- Renderizado pelo controller -->
    </div>

    <!-- Filtros -->
    <div class="flex flex-wrap align-center gap-3 mb-4">
        <div class="flex-1 flex align-center bg-bg-surface border border-dashed border-border rounded-lg px-3 py-2 focus-within-border-primary transition-colors">
            <i data-lucide="search" class="text-secondary mr-2 icon-sm"></i>
            <input type="text" id="input-busca-fidelidade" class="bg-transparent border-none w-100 text-primary outline-none text-sm" placeholder="Buscar cliente por nome ou telefone...">
        </div>
    </div>

    <!-- Tabela -->
    <div class="config-card mb-0 shadow-sm border-dashed">
        <div class="table-responsive">
            <table class="data-table w-100" id="fidelidade-table">
                <thead>
                    <tr>
                        <th class="text-left text-secondary text-xs uppercase tracking-wider font-bold py-3 px-3 border-bottom-dashed">Cliente & Progresso</th>
                        <th class="text-right text-secondary text-xs uppercase tracking-wider font-bold py-3 px-3 border-bottom-dashed">Ações</th>
                    </tr>
                </thead>
                <tbody id="fidelidade-table-body">
                    <!-- Skeletons injetados via JS -->
                </tbody>
            </table>
        </div>
        <!-- Paginação -->
        <div class="flex flex-wrap justify-between align-center border-top-dashed p-4 gap-3 bg-bg-surface" style="border-bottom-left-radius: 12px; border-bottom-right-radius: 12px;">
            <div class="text-sm text-secondary">
                Mostrando <span id="pag-inicio-fidelidade" class="font-bold text-primary">0</span> a <span id="pag-fim-fidelidade" class="font-bold text-primary">0</span> de <span id="pag-total-fidelidade" class="font-bold text-primary">0</span>
            </div>
            <div class="flex gap-2 align-center">
                <button id="btn-prev-page-fidelidade" class="btn bg-placeholder border-none text-secondary rounded-md px-3 py-1 cursor-pointer hover-bg-hover transition-colors" disabled>
                    <i data-lucide="chevron-left" class="icon-sm"></i>
                </button>
                <span id="pag-atual-fidelidade" class="text-sm font-medium text-primary px-3 bg-placeholder rounded-md py-1">1 / 1</span>
                <button id="btn-next-page-fidelidade" class="btn bg-placeholder border-none text-secondary rounded-md px-3 py-1 cursor-pointer hover-bg-hover transition-colors" disabled>
                    <i data-lucide="chevron-right" class="icon-sm"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal de Configuração -->
    <div id="modal-fidelidade" class="modal-overlay d-none">
        <div class="modal-content config-card max-w-500">
            <div class="flex justify-between align-center mb-4 border-bottom-dashed pb-3">
                <div class="flex align-center gap-2">
                    <div class="bg-primary-light text-primary p-2 rounded-lg">
                        <i data-lucide="award" class="icon-sm"></i>
                    </div>
                    <h3 id="modal-fidelidade-title" class="text-primary font-bold mb-0">Configuração do Programa</h3>
                </div>
                <button id="btn-close-modal-fidelidade" class="btn bg-transparent border-none text-secondary cursor-pointer hover:text-danger transition-colors">
                    <i data-lucide="x"></i>
                </button>
            </div>
            
            <form id="form-fidelidade">
                <div class="mb-4 p-3 bg-bg-surface border border-dashed border-border rounded-lg flex align-center justify-between">
                    <div>
                        <label class="font-bold text-sm text-primary block mb-1">Status do Programa</label>
                        <span class="text-xs text-secondary">Habilite para começar a pontuar</span>
                    </div>
                    <select id="input-fidelidade-status" class="bg-placeholder border-dashed rounded-md px-3 py-2 text-primary outline-none text-sm cursor-pointer font-medium">
                        <option value="ativo">Ativado</option>
                        <option value="inativo">Desativado</option>
                    </select>
                </div>
                
                <div class="grid grid-md-2 gap-4 mb-5">
                    <div>
                        <label class="font-medium text-sm text-secondary mb-1 inline-flex align-center gap-1"><i data-lucide="target" class="icon-xs"></i> Meta de Agendamentos</label>
                        <input type="number" id="input-fidelidade-pontos" class="w-100 bg-bg-surface border border-dashed border-border rounded-lg px-3 py-2 text-primary outline-none text-sm focus-border-primary transition-colors" placeholder="Ex: 10" required>
                    </div>
                    <div>
                        <label class="font-medium text-sm text-secondary mb-1 inline-flex align-center gap-1"><i data-lucide="gift" class="icon-xs"></i> Recompensa ao Atingir</label>
                        <input type="text" id="input-fidelidade-recompensa" class="w-100 bg-bg-surface border border-dashed border-border rounded-lg px-3 py-2 text-primary outline-none text-sm focus-border-primary transition-colors" placeholder="Ex: 1 Corte Grátis" required>
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-2">
                    <button type="button" class="btn btn-outline border-dashed text-secondary px-4 cursor-pointer rounded-lg" onclick="document.getElementById('modal-fidelidade').classList.add('d-none')">Cancelar</button>
                    <button type="submit" class="btn btn-primary px-6 py-2 rounded-lg cursor-pointer flex align-center gap-2 shadow-sm hover-float">
                        <i data-lucide="save" class="icon-sm"></i> Salvar Regras
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Resgatar Pontos -->
    <div id="modal-resgate" class="modal-overlay d-none">
        <div class="modal-content config-card" style="max-width: 420px;">
            <div class="flex justify-between align-center mb-4 border-bottom-dashed pb-3">
                <div class="flex align-center gap-2">
                    <div class="bg-success-light text-success p-2 rounded-lg">
                        <i data-lucide="gift" class="icon-sm"></i>
                    </div>
                    <h3 class="text-primary mb-0">Resgatar Prêmio</h3>
                </div>
                <button id="btn-close-modal-resgate" class="btn bg-transparent border-none text-secondary cursor-pointer hover:text-danger">
                    <i data-lucide="x"></i>
                </button>
            </div>
            
            <div class="bg-bg-surface border-dashed rounded-lg p-3 text-center mb-4">
                <p class="text-xs text-secondary uppercase tracking-widest font-bold mb-1">Pontos Disponíveis</p>
                <h2 id="resgate-pontos-atuais" class="text-3xl text-success m-0">0</h2>
            </div>
            
            <form id="form-resgate">
                <input type="hidden" id="resgate-cliente-id">
                <input type="hidden" id="resgate-pontos-max">
                
                <div class="mb-4">
                    <label class="font-medium text-sm text-secondary mb-2 block text-center">Quantos pontos deseja utilizar agora?</label>
                    <div class="flex justify-center align-center">
                        <input type="number" id="input-resgate-qtd" class="bg-bg-base border border-primary text-primary outline-none text-center rounded-lg text-lg font-bold" style="width: 120px; padding: 12px;" min="1" required>
                    </div>
                </div>

                <button type="submit" class="btn bg-success text-white w-100 py-3 rounded-lg cursor-pointer flex justify-center align-center gap-2 shadow-sm hover-float border-none font-bold">
                    <i data-lucide="check-circle"></i> Confirmar Resgate
                </button>
            </form>
        </div>
    </div>
</div>
