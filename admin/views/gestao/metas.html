<div class="admin-section">
    <!-- Header -->
    <div class="flex flex-wrap justify-between align-center gap-3 mb-4">
        <div>
            <h2 class="mb-1 text-primary">Metas de Faturamento</h2>
            <p class="text-secondary text-sm">Acompanhe as metas mensais para engajar o crescimento da loja.</p>
        </div>
        <button id="btn-configurar-meta" class="btn btn-primary shadow-sm hover-float flex align-center gap-2 cursor-pointer">
            <i data-lucide="target" class="icon-sm"></i> Nova Meta
        </button>
    </div>

    <!-- Progresso Atual (Injetado via JS) -->
    <div id="metas-progresso-card" class="mb-5">
        <!-- Renderizado pelo controller -->
    </div>

    <!-- Histórico de Metas -->
    <div class="config-card mb-0 shadow-sm border-dashed">
        <h3 class="mb-3 text-primary text-md">Histórico de Metas</h3>
        <div class="table-responsive">
            <table class="data-table w-100" id="metas-table">
                <thead>
                    <tr>
                        <th class="text-left text-secondary text-xs uppercase tracking-wider font-bold py-3 px-3 border-bottom-dashed">Referência & Desempenho</th>
                        <th class="text-right text-secondary text-xs uppercase tracking-wider font-bold py-3 px-3 border-bottom-dashed">Ações</th>
                    </tr>
                </thead>
                <tbody id="metas-table-body">
                    <!-- Skeletons injetados via JS -->
                </tbody>
            </table>
        </div>
        <!-- Paginação -->
        <div class="flex flex-wrap justify-between align-center border-top-dashed p-4 gap-3 bg-bg-surface" style="border-bottom-left-radius: 12px; border-bottom-right-radius: 12px;">
            <div class="text-sm text-secondary">
                Mostrando <span id="pag-inicio-meta" class="font-bold text-primary">0</span> a <span id="pag-fim-meta" class="font-bold text-primary">0</span> de <span id="pag-total-meta" class="font-bold text-primary">0</span>
            </div>
            <div class="flex gap-2 align-center">
                <button id="btn-prev-page-meta" class="btn bg-placeholder border-none text-secondary rounded-md px-3 py-1 cursor-pointer hover-bg-hover transition-colors" disabled>
                    <i data-lucide="chevron-left" class="icon-sm"></i>
                </button>
                <span id="pag-atual-meta" class="text-sm font-medium text-primary px-3 bg-placeholder rounded-md py-1">1 / 1</span>
                <button id="btn-next-page-meta" class="btn bg-placeholder border-none text-secondary rounded-md px-3 py-1 cursor-pointer hover-bg-hover transition-colors" disabled>
                    <i data-lucide="chevron-right" class="icon-sm"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal de Configuração -->
    <div id="modal-meta" class="modal-overlay d-none">
        <div class="modal-content config-card max-w-500">
            <div class="flex justify-between align-center mb-4 border-bottom-dashed pb-3">
                <div class="flex align-center gap-2">
                    <div class="bg-primary-light text-primary p-2 rounded-lg">
                        <i data-lucide="target" class="icon-sm"></i>
                    </div>
                    <h3 id="modal-meta-title" class="text-primary font-bold mb-0">Configurar Meta Mensal</h3>
                </div>
                <button id="btn-close-modal-meta" class="btn bg-transparent border-none text-secondary cursor-pointer hover:text-danger transition-colors">
                    <i data-lucide="x"></i>
                </button>
            </div>
            
            <form id="form-meta">
                <div class="grid grid-md-2 gap-4 mb-5">
                    <div>
                        <label class="font-medium text-sm text-secondary mb-1 inline-flex align-center gap-1"><i data-lucide="calendar" class="icon-xs"></i> Mês de Referência</label>
                        <input type="month" id="input-meta-mes" class="w-100 bg-bg-surface border border-dashed border-border rounded-lg px-3 py-2 text-primary outline-none text-sm focus-border-primary transition-colors" required>
                    </div>
                    <div>
                        <label class="font-medium text-sm text-secondary mb-1 inline-flex align-center gap-1"><i data-lucide="dollar-sign" class="icon-xs"></i> Valor Alvo (R$)</label>
                        <input type="number" step="0.01" id="input-meta-valor" class="w-100 bg-bg-surface border border-dashed border-border rounded-lg px-3 py-2 text-primary outline-none text-sm focus-border-primary transition-colors" placeholder="Ex: 5000.00" required>
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-2">
                    <button type="button" class="btn btn-outline border-dashed text-secondary px-4 cursor-pointer rounded-lg" onclick="document.getElementById('modal-meta').classList.add('d-none')">Cancelar</button>
                    <button type="submit" class="btn btn-primary px-6 py-2 rounded-lg cursor-pointer flex align-center gap-2 shadow-sm hover-float">
                        <i data-lucide="save" class="icon-sm"></i> Salvar Meta
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
