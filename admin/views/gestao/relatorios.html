<div class="admin-section">
    <!-- Header -->
    <div class="flex flex-wrap justify-between align-center gap-3 mb-4">
        <div>
            <h2 class="mb-1 text-primary">Relatórios de Desempenho</h2>
            <p class="text-secondary text-sm">Acompanhe as métricas e o faturamento do seu negócio.</p>
        </div>
        <div class="flex align-center gap-2">
            <select id="filtro-periodo" class="bg-placeholder border-dashed rounded-md px-3 py-2 text-primary outline-none text-sm cursor-pointer">
                <option value="hoje">Hoje</option>
                <option value="semana">Esta Semana</option>
                <option value="mes" selected>Este Mês</option>
                <option value="ano">Este Ano</option>
            </select>
            <button class="btn btn-outline flex align-center gap-2" id="btn-export-relatorio">
                <i data-lucide="download"></i> Exportar
            </button>
        </div>
    </div>

    <!-- Cards de Métricas -->
    <div class="grid grid-md-2 grid-lg-4 gap-4 mb-5" id="relatorios-cards">
        <!-- Injetados via JS -->
    </div>

    <!-- Gráficos -->
    <div class="flex flex-wrap gap-4 mb-5">
        <div class="config-card fade-in" style="flex: 2; min-width: 60%; animation-delay: 0.1s;">
            <div class="flex justify-between align-center mb-3">
                <h3 class="text-primary text-md m-0">Evolução do Faturamento</h3>
            </div>
            <div id="chart-receita-evolucao" style="min-height: 300px;"></div>
        </div>
        <div class="config-card fade-in" style="flex: 1; min-width: 300px; animation-delay: 0.2s;">
            <div class="flex justify-between align-center mb-3">
                <h3 class="text-primary text-md m-0">Composição de Receita</h3>
            </div>
            <div id="chart-receita-composicao" style="min-height: 300px; display: flex; align-items: center; justify-content: center;"></div>
        </div>
    </div>

    <!-- Lista de Top Serviços -->
    <div class="mb-4">
        <h3 class="mb-3 text-primary text-md">Serviços Mais Agendados</h3>
        <div id="relatorios-services-list" class="flex flex-column gap-2">
            <!-- Skeletons / Cards injetados via JS -->
        </div>
    </div>
</div>
